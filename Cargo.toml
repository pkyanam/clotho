[workspace]
resolver = "2"
members = [
    "crates/clotho-common",
    "crates/clotho-vcs",
    "crates/clotho-storage",
    "crates/clotho-merge-queue",
    "crates/clotho-agent-gateway",
    "crates/clotho-diff",
    "crates/clotho-api-gateway",
    "crates/clotho-compute",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pkyanam/clotho"

[workspace.dependencies]
clotho-common = { path = "crates/clotho-common" }
anyhow = "1.0"
futures = "0.3"
# Pre-1.0 and pinned exactly (ADR-0001): upgrade deliberately, never auto.
jj-lib = "=0.43.0"
# Matches the gix version jj-lib 0.43 uses (test-only, for verifying git objects).
gix = "0.85"
# xet-core crates (ADR-0002): chunking, xorb format, shard index. Pinned exactly —
# fast-moving upstream; upgrade deliberately, never auto.
xet-data = "=1.5.2"
xet-core-structures = "=1.5.2"
# S3-compatible object storage client — endpoint+credentials config only, no
# AWS-specific code paths (no vendor lock-in).
object_store = { version = "0.14.0", features = ["aws"] }
async-trait = "0.1"
axum = "0.8"
# tree-sitter core + grammars for the structured diff engine (docs/prd.md §2):
# one symbol-level diff object feeds both the agent API and the PR view.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Official MCP Rust SDK (ADR-0004). Pinned exactly — fast-moving upstream
# (three minor releases in the last month); upgrade deliberately, never auto.
rmcp = { version = "=2.0.0", features = ["schemars", "transport-streamable-http-server"] }
# Control-plane Postgres access + embedded migrations for agent identity.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "derive",
    "uuid",
    "chrono",
] }
sha2 = "0.10"
# HMAC-SHA256 for verifying Forgejo push-webhook signatures (Stage 7).
hmac = "0.12"
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
schemars = "1"
# Plain-HTTP/JSON client for Forgejo's REST API; rustls so the runtime image
# needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Text diffing for the edge PR view's line hunks (Myers over lines); the
# symbol-level structure comes from clotho-diff, not from here.
similar = "2.7"
# CORS for the REST edge — the web app (a different origin in dev) polls it.
tower-http = { version = "0.6", features = ["cors"] }
bytes = "1"
# In-process tar for exporting a repo's bare git object DB to CI sandboxes
# (docs/adr/0008) — filesystem archive only, never a git shell-out.
tar = "0.4"
tempfile = "3"
prost = "0.14.4"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["net"] }
