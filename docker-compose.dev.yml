# Clotho dev stack — `just dev` / `docker compose -f docker-compose.dev.yml up`.
# Postgres (control plane), MinIO (S3-compatible storage for Arachne), and the
# six Clotho services as health-check stubs. Forgejo joins in Stage 3.

name: clotho-dev

x-clotho-service: &clotho-service
  restart: unless-stopped
  environment:
    RUST_LOG: info

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clotho
      POSTGRES_PASSWORD: clotho-dev # dev-only credentials
      POSTGRES_DB: clotho
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clotho"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clotho
      MINIO_ROOT_PASSWORD: clotho-dev # dev-only credentials
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket provisioning: the app bucket plus the bucket the storage
  # integration tests target (crates/clotho-storage/tests/storage.rs).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set clotho http://minio:9000 clotho clotho-dev &&
        mc mb --ignore-existing clotho/clotho-storage clotho/clotho-storage-test
    restart: "no"

  clotho-vcs:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-vcs }
    environment:
      RUST_LOG: info
      CLOTHO_VCS_DATA_DIR: /var/lib/clotho/vcs-repos
    ports:
      - "50051:50051"
    volumes:
      - vcs-data:/var/lib/clotho

  clotho-storage:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-storage }
    environment:
      RUST_LOG: info
      CLOTHO_STORAGE_DATA_DIR: /var/lib/clotho/storage
      CLOTHO_STORAGE_S3_ENDPOINT: http://minio:9000
      CLOTHO_STORAGE_S3_BUCKET: clotho-storage
      CLOTHO_STORAGE_S3_ACCESS_KEY: clotho
      CLOTHO_STORAGE_S3_SECRET_KEY: clotho-dev # dev-only credentials
    ports:
      - "50052:50052"
    volumes:
      - storage-data:/var/lib/clotho
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  clotho-merge-queue:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-merge-queue }
    ports:
      - "50053:50053"

  clotho-agent-gateway:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-agent-gateway }
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy

  clotho-diff:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-diff }
    ports:
      - "50055:50055"

  clotho-api-gateway:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-api-gateway }
    ports:
      - "50056:50056"
    depends_on:
      - clotho-vcs
      - clotho-storage
      - clotho-merge-queue
      - clotho-agent-gateway
      - clotho-diff

volumes:
  postgres-data:
  minio-data:
  vcs-data:
  storage-data:
