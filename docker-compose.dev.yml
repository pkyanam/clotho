# Clotho dev stack — `just dev` / `docker compose -f docker-compose.dev.yml up`.
# Postgres (control plane + Forgejo), MinIO (S3-compatible storage for
# Arachne), Forgejo (collaboration shell, pinned to the collab/forgejo
# submodule tag), and the six Clotho services.

name: clotho-dev

x-clotho-service: &clotho-service
  restart: unless-stopped
  environment:
    RUST_LOG: info

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clotho
      POSTGRES_PASSWORD: clotho-dev # dev-only credentials
      POSTGRES_DB: clotho
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Provisions Forgejo's own database/user; only runs when postgres-data
      # is first created (run `just dev-down` once if upgrading a live stack).
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clotho"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clotho
      MINIO_ROOT_PASSWORD: clotho-dev # dev-only credentials
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket provisioning: the app bucket plus the bucket the storage
  # integration tests target (crates/clotho-storage/tests/storage.rs).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set clotho http://minio:9000 clotho clotho-dev &&
        mc mb --ignore-existing clotho/clotho-storage clotho/clotho-storage-test
    restart: "no"

  # Collaboration shell (docs/adr/0003): official image at the same version
  # the collab/forgejo submodule is pinned to. Its repository root is the
  # shared git-data volume where clotho-vcs creates the backing bare git
  # repos, laid out as <owner>/<repo>.git for Forgejo's adopt flow.
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.3
    restart: unless-stopped
    environment:
      # Match clotho-vcs's uid so both sides can write the shared git volume.
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: forgejo-dev # dev-only credentials
      # Skip the interactive install wizard; provisioning is scripted
      # (scripts/forgejo/provision.sh) so a clean `up` is reproducible.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://localhost:13000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__repository__ROOT: /data/git/repositories
      FORGEJO__repository__DEFAULT_BRANCH: main
      # Lets the API gateway adopt the bare git repos clotho-vcs writes.
      FORGEJO__repository__ALLOW_ADOPTION_OF_UNADOPTED_REPOSITORIES: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # Allow push webhooks to reach the gateway by service name (Forgejo
      # blocks private/loopback webhook targets by default) — Stage 7 CI.
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "13000:3000"
    volumes:
      - forgejo-data:/data
      - git-data:/data/git/repositories
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot Forgejo provisioning: admin user + API token for the gateway.
  forgejo-init:
    image: codeberg.org/forgejo/forgejo:15.0.3
    entrypoint: ["/bin/sh", "/provision.sh"]
    volumes:
      - forgejo-data:/data
      - forgejo-token:/run/clotho
      - ./scripts/forgejo/provision.sh:/provision.sh:ro
    depends_on:
      forgejo:
        condition: service_healthy
    restart: "no"

  clotho-vcs:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-vcs }
    environment:
      RUST_LOG: info
      CLOTHO_VCS_DATA_DIR: /var/lib/clotho/vcs-repos
      # Backing bare git repos land here, on the volume Forgejo reads as its
      # repository root; `clotho` is the owner (the admin user) in Forgejo's
      # <owner>/<repo>.git layout.
      CLOTHO_VCS_GIT_REPOS_DIR: /var/lib/clotho/git-repos/clotho
    ports:
      - "50051:50051"
    volumes:
      - vcs-data:/var/lib/clotho
      - git-data:/var/lib/clotho/git-repos

  clotho-storage:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-storage }
    environment:
      RUST_LOG: info
      CLOTHO_STORAGE_DATA_DIR: /var/lib/clotho/storage
      CLOTHO_STORAGE_S3_ENDPOINT: http://minio:9000
      CLOTHO_STORAGE_S3_BUCKET: clotho-storage
      CLOTHO_STORAGE_S3_ACCESS_KEY: clotho
      CLOTHO_STORAGE_S3_SECRET_KEY: clotho-dev # dev-only credentials
    ports:
      - "50052:50052"
    volumes:
      - storage-data:/var/lib/clotho
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Merge-queue (docs/prd.md §5 Stage 5): serializes concurrent agent
  # submissions per repo and lands them on main via clotho-vcs.
  clotho-merge-queue:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-merge-queue }
    environment:
      RUST_LOG: info
      CLOTHO_VCS_GRPC_URL: http://clotho-vcs:50051
    ports:
      - "50053:50053"
    depends_on:
      clotho-vcs:
        condition: service_started

  # Agent interface layer (docs/prd.md §5 Stage 4): MCP over streamable HTTP
  # on 8090 plus the admin surface (create agents, mint scoped tokens, read
  # the audit log); agent identity lives in the `clotho` Postgres database.
  clotho-agent-gateway:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-agent-gateway }
    environment:
      RUST_LOG: info
      CLOTHO_AGENT_DATABASE_URL: postgres://clotho:clotho-dev@postgres:5432/clotho
      CLOTHO_VCS_GRPC_URL: http://clotho-vcs:50051
      CLOTHO_DIFF_GRPC_URL: http://clotho-diff:50055
      CLOTHO_MERGE_QUEUE_GRPC_URL: http://clotho-merge-queue:50053
      CLOTHO_AGENT_HTTP_ADDR: 0.0.0.0:8090
      CLOTHO_AGENT_ADMIN_TOKEN: clotho-agent-admin-dev # dev-only credentials
    ports:
      - "50054:50054"
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      clotho-vcs:
        condition: service_started
      clotho-diff:
        condition: service_started

  clotho-diff:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-diff }
    ports:
      - "50055:50055"

  # Pluggable compute (docs/prd.md §5 Stage 7, docs/adr/0008): the CCI over
  # gRPC. Daytona is the first provider; with no DAYTONA_API_KEY it starts in
  # disabled mode (the stack stays healthy, CI jobs fail cleanly). Credentials
  # come from a gitignored .env (see .env.example).
  clotho-compute:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-compute }
    environment:
      RUST_LOG: info
      CLOTHO_COMPUTE_PROVIDER: ${CLOTHO_COMPUTE_PROVIDER:-daytona}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_PROXY_URL: ${DAYTONA_PROXY_URL:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      DAYTONA_ORGANIZATION_ID: ${DAYTONA_ORGANIZATION_ID:-}
      CLOTHO_COMPUTE_SNAPSHOT: ${CLOTHO_COMPUTE_SNAPSHOT:-}
    ports:
      - "50057:50057"

  clotho-api-gateway:
    <<: *clotho-service
    build:
      context: .
      dockerfile: infra/docker/rust-services.Dockerfile
      args: { SERVICE: clotho-api-gateway }
    environment:
      RUST_LOG: info
      CLOTHO_GATEWAY_HTTP_ADDR: 0.0.0.0:8080
      CLOTHO_GATEWAY_DATABASE_URL: postgres://clotho:clotho-dev@postgres:5432/clotho
      CLOTHO_VCS_GRPC_URL: http://clotho-vcs:50051
      CLOTHO_DIFF_GRPC_URL: http://clotho-diff:50055
      CLOTHO_MERGE_QUEUE_GRPC_URL: http://clotho-merge-queue:50053
      # Agent presence (Stage 6): proxied from the agent gateway's admin
      # sessions endpoint with a service-to-service token (docs/adr/0007).
      CLOTHO_AGENT_GATEWAY_URL: http://clotho-agent-gateway:8090
      CLOTHO_AGENT_ADMIN_TOKEN: clotho-agent-admin-dev # dev-only credentials
      CLOTHO_FORGEJO_URL: http://forgejo:3000
      CLOTHO_FORGEJO_OWNER: clotho
      CLOTHO_FORGEJO_TOKEN_FILE: /run/clotho/forgejo-token
      # Stage 7 CI (docs/adr/0008): the compute service (CCI), the URL Forgejo
      # calls for pushes (reachable by service name on this network), the
      # shared HMAC secret, and the web app base for status target links.
      CLOTHO_COMPUTE_GRPC_URL: http://clotho-compute:50057
      CLOTHO_COMPUTE_PROVIDER: ${CLOTHO_COMPUTE_PROVIDER:-daytona}
      CLOTHO_COMPUTE_SNAPSHOT: ${CLOTHO_COMPUTE_SNAPSHOT:-}
      CLOTHO_ACTIONS_TIMEOUT_SECONDS: ${CLOTHO_ACTIONS_TIMEOUT_SECONDS:-900}
      CLOTHO_DAYTONA_CONFIGURED: ${DAYTONA_API_KEY:+true}
      CLOTHO_WEBHOOK_URL: http://clotho-api-gateway:8080/api/v1/webhooks/forgejo
      CLOTHO_WEBHOOK_SECRET: ${CLOTHO_WEBHOOK_SECRET:-clotho-webhook-dev}
      CLOTHO_WEB_URL: ${CLOTHO_WEB_URL:-http://localhost:3100}
    ports:
      - "50056:50056"
      - "8080:8080"
    volumes:
      - forgejo-token:/run/clotho:ro
    depends_on:
      clotho-vcs:
        condition: service_started
      clotho-storage:
        condition: service_started
      clotho-merge-queue:
        condition: service_started
      clotho-agent-gateway:
        condition: service_started
      clotho-diff:
        condition: service_started
      clotho-compute:
        condition: service_started
      forgejo-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
  vcs-data:
  storage-data:
  forgejo-data:
  forgejo-token:
  # Bare git repos, written by clotho-vcs and read by Forgejo (docs/adr/0003).
  git-data:
