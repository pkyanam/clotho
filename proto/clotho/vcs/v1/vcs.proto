syntax = "proto3";

package clotho.vcs.v1;

// The Clotho VCS engine — a jj-native, git-compatible version control service.
// Backed by jj-lib embedded in-process (never the jj/git CLI). Every commit it
// writes is a real git commit; the operation log is a first-class API.
service Vcs {
  // Create a new, empty repository (internal git backend).
  rpc InitRepo(InitRepoRequest) returns (InitRepoResponse);
  // Write a commit from explicit file contents (server-side tree build; no
  // working copy involved, so there is no staging area to forget).
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Record a named checkpoint in the operation log and return its id, so a
  // supervisor can always restore an agent session to this exact state.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  // Restore the repository view to a previous operation (checkpoint or any
  // op-log entry). This is itself recorded as a new operation — nothing is
  // ever erased.
  rpc RestoreTo(RestoreToRequest) returns (RestoreToResponse);
  // Query the repository's operation log, newest first.
  rpc QueryOpLog(QueryOpLogRequest) returns (QueryOpLogResponse);
  // Current head commits of the repository plus the `main` bookmark target —
  // the "where am I" half of an agent's situational awareness.
  rpc GetHeads(GetHeadsRequest) returns (GetHeadsResponse);
  // List the files in a commit's tree (default: the `main` bookmark target).
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // Changed files between two commits, with full before/after contents —
  // the raw material for clotho-diff's structured symbol diff.
  rpc DiffCommits(DiffCommitsRequest) returns (DiffCommitsResponse);
}

message InitRepoRequest {
  // Repository name: [a-z0-9][a-z0-9-_]*, max 100 chars.
  string name = 1;
}

message InitRepoResponse {
  string name = 1;
  // Operation id of the repo-creation operation (root of the op log).
  string operation_id = 2;
}

message FileChange {
  // Repo-relative path, e.g. "src/main.rs".
  string path = 1;
  bytes content = 2;
  bool executable = 3;
}

message CommitRequest {
  string repo = 1;
  // Parent commit ids (hex). Empty means: commit on top of the repo's current
  // head(s) — a merge commit if there are several.
  repeated string parent_commit_ids = 2;
  repeated FileChange files = 3;
  // Paths to delete relative to the base tree.
  repeated string deleted_paths = 4;
  string message = 5;
  string author_name = 6;
  string author_email = 7;
}

message CommitResponse {
  // Git-compatible commit id (hex sha).
  string commit_id = 1;
  // jj change id (hex) — stable across rewrites.
  string change_id = 2;
  // Operation-log entry this commit was recorded in.
  string operation_id = 3;
}

message CheckpointRequest {
  string repo = 1;
  // Human/agent-readable label, e.g. "before refactoring auth".
  string label = 2;
}

message CheckpointResponse {
  string operation_id = 1;
}

message RestoreToRequest {
  string repo = 1;
  string operation_id = 2;
}

message RestoreToResponse {
  // The new operation recording the restore.
  string operation_id = 1;
}

message QueryOpLogRequest {
  string repo = 1;
  // 0 means no limit.
  uint32 limit = 2;
}

message OpLogEntry {
  string operation_id = 1;
  string description = 2;
  int64 start_time_millis = 3;
  int64 end_time_millis = 4;
  repeated string parent_operation_ids = 5;
}

message QueryOpLogResponse {
  // Newest first.
  repeated OpLogEntry entries = 1;
}

message CommitSummary {
  // Git-compatible commit id (hex sha).
  string commit_id = 1;
  // jj change id (hex) — stable across rewrites.
  string change_id = 2;
  string description = 3;
  string author_name = 4;
  string author_email = 5;
  int64 timestamp_millis = 6;
  repeated string parent_commit_ids = 7;
}

message GetHeadsRequest {
  string repo = 1;
}

message GetHeadsResponse {
  // All current head commits (jj keeps anonymous heads first-class).
  repeated CommitSummary heads = 1;
  // Commit the `main` bookmark points at; empty while main is unborn.
  string main_commit_id = 2;
}

message ListFilesRequest {
  string repo = 1;
  // Commit whose tree to list; empty means the `main` bookmark target.
  string commit_id = 2;
}

message FileEntry {
  // Repo-relative path.
  string path = 1;
  uint64 size_bytes = 2;
  bool executable = 3;
}

message ListFilesResponse {
  string commit_id = 1;
  repeated FileEntry files = 2;
}

message DiffCommitsRequest {
  string repo = 1;
  // Base commit; empty means the first parent of `to_commit_id`.
  string from_commit_id = 2;
  string to_commit_id = 3;
}

message ChangedFile {
  enum ChangeKind {
    CHANGE_KIND_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
  }
  string path = 1;
  ChangeKind kind = 2;
  // Full contents on each side; empty on the absent side of an add/delete.
  bytes old_content = 3;
  bytes new_content = 4;
}

message DiffCommitsResponse {
  string from_commit_id = 1;
  string to_commit_id = 2;
  repeated ChangedFile files = 3;
}
