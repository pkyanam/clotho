  /api/v1/webhooks/forgejo:
    post:
      x-clotho-auth: webhook-hmac
      tags: [webhooks]
      operationId: forgejoWebhook
      summary: Internal Forgejo push webhook (HMAC-verified and replay-safe)
      description: |
        Requires an exact-body HMAC, a provider event header, and either
        `X-Forgejo-Delivery` or `X-Gitea-Delivery` (1–128 visible ASCII
        characters). Clotho stores only
        SHA-256 hashes of the delivery id and body for 24 hours. The first
        valid delivery schedules CI and returns 202; an exact replay returns a
        harmless 200 `replayed`; reusing the id with different bytes returns
        409. Missing signing configuration or durable storage fails closed.
      parameters:
        - name: X-Forgejo-Event
          in: header
          description: Provider event name; required unless X-Gitea-Event is present
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: X-Gitea-Event
          in: header
          description: Compatibility alias for X-Forgejo-Event
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: X-Forgejo-Delivery
          in: header
          description: Preferred opaque provider delivery id; required unless X-Gitea-Delivery is present
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[!-~]+$"
        - name: X-Gitea-Delivery
          in: header
          description: Compatibility alias for X-Forgejo-Delivery
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[!-~]+$"
        - name: X-Forgejo-Signature
          in: header
          description: Hexadecimal HMAC-SHA256 of the exact request body; X-Gitea-Signature is also accepted
          schema:
            type: string
            pattern: "^[0-9A-Fa-f]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookPushRequest" }
      responses:
        "200":
          description: Ignored event/deletion or harmless exact replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResponse" }
        "202":
          description: Accepted delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResponse" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

components:
  parameters:
    repoPageLimit:
      name: limit
      in: query
      description: Repository page size; bounded to protect the control plane
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: Opaque retry key scoped to the immutable organization and authenticated principal; retained for 24 hours
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    repoPageCursor:
      name: cursor
      in: query
      description: Opaque cursor returned as next_cursor by the preceding page
      schema:
        type: string
        maxLength: 2048
    activityPageLimit:
      name: limit
      in: query
      description: Activity page size; bounded to protect the control plane
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    activityPageCursor:
      name: cursor
      in: query
      description: Opaque cursor returned as next_cursor by the preceding activity page
      schema:
        type: string
        maxLength: 2048
    org:
      name: org
      in: path
      required: true
      schema:
        type: string
    repoName:
      name: name
      in: path
      required: true
      schema:
        type: string
    repoPath:
      name: repo
      in: path
      required: true
      schema:
        type: string
    issueNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
    pullNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
    runId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    secretName:
      name: secretName
      in: path
      required: true
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Human API token (`clotho_tok_…`)
    agentBearerAuth:
      type: http
      scheme: bearer
      description: Scoped agent token (`clotho_agt_…`), accepted only by the operations backing its declared MCP tools

  responses:
    Error:
      description: Versioned error envelope
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            version: "1"
            code: not_found
            message: repo "weave" not found
            request_id: 0190f3b6-3b44-7d4c-a180-2f87ef7e20f1
            retryable: false

  headers:
    XRequestId:
      description: Opaque request correlation id; accepted from a valid inbound X-Request-Id or generated by Clotho
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyReplayed:
      description: Whether the response was replayed from the persisted idempotency record
      required: true
      schema:
        type: boolean

  schemas:
    CapabilityDocument:
      type: object
      required: [schema_version, release_tier, canonical_contract, rest, surfaces, repository_kinds, agent, limits, providers, stability]
      properties:
        schema_version: { type: string, example: "1" }
        release_tier: { type: string, example: public-alpha }
        canonical_contract: { type: string, enum: [rest] }
        rest: { type: object, additionalProperties: true }
        surfaces: { type: array, items: { type: string } }
        repository_kinds: { type: array, items: { type: string } }
        agent: { type: object, additionalProperties: true }
        limits: { type: object, additionalProperties: true }
        providers: { type: object, additionalProperties: true }
        stability: { type: string, enum: [alpha] }
    HuggingFaceObject:
      type: object
      description: Hugging Face-compatible projection; fields follow the upstream client contract
      additionalProperties: true
    HuggingFaceObjectList:
      type: array
      items:
        $ref: "#/components/schemas/HuggingFaceObject"
    WebhookPushRequest:
      type: object
      required: [after, repository]
      properties:
        after: { type: string }
        repository:
          type: object
          required: [name]
          properties:
            name: { type: string }
    WebhookResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, ignored, replayed] }
        repo: { type: string }
        sha: { type: string }
        reason: { type: string }
    Error:
      type: object
      required: [version, code, message, request_id, retryable]
      additionalProperties: false
      properties:
        version:
          type: string
          enum: ["1"]
          description: Error envelope version, independent of the API path version
        code:
          type: string
          description: Stable machine-readable error code
          enum:
            - invalid_request
            - unauthenticated
            - permission_denied
            - not_found
            - method_not_allowed
            - conflict
            - idempotency_conflict
            - policy_conflict
            - payload_too_large
            - range_not_satisfiable
            - rate_limited
            - upstream_unavailable
            - service_unavailable
            - upstream_timeout
            - internal_error
        message:
          type: string
          description: Safe human-readable message; never contains secrets or internal topology
        request_id:
          type: string
        retryable:
          type: boolean
          description: Whether retrying later without changing the request may succeed
        details:
          description: Optional safe structured context such as field-level validation errors
    HealthStatus:
      type: object
      required: [service, version, status]
      properties:
