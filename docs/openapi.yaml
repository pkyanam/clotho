openapi: 3.0.3
info:
  title: Clotho API Gateway
  description: |
    Product REST contract for Clotho (`/api/v1/*`). Humans use the CLI; agents
    use MCP tools that call this same edge; the web app and `@clotho/sdk-js`
    share it. Errors use `{ "error": "..." }` with 4xx/5xx status codes.

    **Auth (prototype):** most routes are unauthenticated. Agent admin lives on
    the agent-gateway (`/admin/v1/*`), not this edge. Secrets master key is
    server-side only (`CLOTHO_SECRETS_MASTER_KEY`).
  version: 0.1.0
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8080
    description: Local dev stack (`just dev`)

tags:
  - name: health
  - name: control
  - name: repos
  - name: issues
  - name: pulls
  - name: actions
  - name: providers
  - name: secrets
  - name: agents
  - name: webhooks

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openapi.yaml:
    get:
      tags: [health]
      operationId: openapiYaml
      summary: This OpenAPI document (YAML)
      responses:
        "200":
          description: OpenAPI 3 YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/users:
    get:
      tags: [control]
      operationId: listUsers
      summary: List control-plane users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"

  /api/v1/orgs:
    get:
      tags: [control]
      operationId: listOrgs
      summary: List organizations
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Org"
    post:
      tags: [control]
      operationId: createOrg
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                display_name:
                  type: string
                forgejo_owner:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/orgs/{org}:
    get:
      tags: [control]
      operationId: getOrg
      summary: Org detail with members
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: Org detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/orgs/{org}/repos:
    get:
      tags: [control]
      operationId: listOrgRepos
      summary: List repos owned by an org
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoInfo"

  /api/v1/activity:
    get:
      tags: [control]
      operationId: listActivity
      summary: Global activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityEvent"

  /api/v1/repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: List all repos
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoInfo"
    post:
      tags: [repos]
      operationId: createRepo
      summary: Create a repo (VCS + collab shell)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, private, internal]
                default_branch:
                  type: string
                  default: main
                owner_org:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRepo"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}:
    get:
      tags: [repos]
      operationId: getRepo
      summary: Repo detail (heads, main, clone URL)
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/tree:
    get:
      tags: [repos]
      operationId: getTree
      summary: File tree at a commit
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"

  /api/v1/repos/{name}/file:
    get:
      tags: [repos]
      operationId: getFile
      summary: Single file contents
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: File
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/commits:
    get:
      tags: [repos]
      operationId: listCommits
      summary: Commit log
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: from_commit_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Commit"
    post:
      tags: [repos]
      operationId: createCommit
      summary: Create a commit from explicit file contents
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                files:
                  type: array
                  items:
                    type: object
                    required: [path, content]
                    properties:
                      path:
                        type: string
                      content:
                        type: string
                      executable:
                        type: boolean
                deleted_paths:
                  type: array
                  items:
                    type: string
                parent_commit_ids:
                  type: array
                  items:
                    type: string
                author_name:
                  type: string
                author_email:
                  type: string
      responses:
        "201":
          description: Created commit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCommit"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/oplog:
    get:
      tags: [repos]
      operationId: getOpLog
      summary: jj operation log
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Op log
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpLogEntry"

  /api/v1/repos/{name}/submit:
    post:
      tags: [repos]
      operationId: submitChange
      summary: Submit a commit through the merge queue onto main
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit_id]
              properties:
                commit_id:
                  type: string
      responses:
        "200":
          description: Landed or conflicted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"

  /api/v1/repos/{name}/issues:
    get:
      tags: [issues]
      operationId: listIssues
      summary: List issues
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
    post:
      tags: [issues]
      operationId: createIssue
      summary: Open an issue
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/issues/{number}:
    get:
      tags: [issues]
      operationId: getIssue
      summary: Issue detail with comments
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/issueNumber"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/issues/{number}/comments:
    post:
      tags: [issues]
      operationId: commentOnIssue
      summary: Comment on an issue
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/issueNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/repos/{name}/pulls:
    get:
      tags: [pulls]
      operationId: listPulls
      summary: List pull requests
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: all
      responses:
        "200":
          description: Pulls
          content:
            application/json:
              schema:
                type: object
                required: [pulls]
                properties:
                  pulls:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pull"
    post:
      tags: [pulls]
      operationId: createPull
      summary: Open a pull request
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, head]
              properties:
                title:
                  type: string
                body:
                  type: string
                head:
                  type: string
                base:
                  type: string
                  default: main
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pull"

  /api/v1/repos/{name}/pulls/{number}:
    get:
      tags: [pulls]
      operationId: getPull
      summary: Pull request detail
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/pullNumber"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pull"

  /api/v1/repos/{name}/pulls/{number}/comments:
    post:
      tags: [pulls]
      operationId: commentOnPull
      summary: Comment on a pull request
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/pullNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/repos/{name}/pulls/{number}/reviews:
    post:
      tags: [pulls]
      operationId: reviewPull
      summary: Submit a review (COMMENT, APPROVE, REQUEST_CHANGES)
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/pullNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                event:
                  type: string
                  enum: [COMMENT, APPROVE, REQUEST_CHANGES]
                  default: COMMENT
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/repos/{name}/pulls/{number}/merge:
    post:
      tags: [pulls]
      operationId: mergePull
      summary: Merge a pull request
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/pullNumber"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [merge, rebase, rebase-merge, squash]
                  default: merge
                title:
                  type: string
                message:
                  type: string
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pull"

  /api/v1/repos/{name}/pulls/{number}/diff:
    get:
      tags: [pulls]
      operationId: pullDiff
      summary: Structured symbol-level PR diff
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/pullNumber"
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullDiff"

  /api/v1/repos/{name}/branches:
    get:
      tags: [repos]
      operationId: listBranches
      summary: List branches
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"

  /api/v1/repos/{name}/commits/{sha}/statuses:
    get:
      tags: [repos]
      operationId: commitStatuses
      summary: Commit status checks
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: sha
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statuses
          content:
            application/json:
              schema:
                type: object
                required: [statuses]
                properties:
                  statuses:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommitStatus"

  /api/v1/repos/{name}/actions/runs:
    get:
      tags: [actions]
      operationId: listActionRuns
      summary: List Action runs
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: integer
            format: int64
            description: Cursor (created_at_millis of last seen run)
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRunList"
    post:
      tags: [actions]
      operationId: createActionRun
      summary: Start a manual Action run
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commit_id:
                  type: string
                  description: Empty = current main head
                branch:
                  type: string
                  default: main
                actor:
                  type: string
                  default: manual
      responses:
        "202":
          description: Accepted / queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRun"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/actions/runs/{run_id}:
    get:
      tags: [actions]
      operationId: getActionRun
      summary: Get one Action run
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRun"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/actions/runs/{run_id}/logs:
    get:
      tags: [actions]
      operationId: getActionLogs
      summary: Action run logs (text)
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionLog"

  /api/v1/repos/{name}/actions/config:
    get:
      tags: [actions]
      operationId: getActionsConfig
      summary: Repo Actions configuration
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsConfig"
    put:
      tags: [actions]
      operationId: putActionsConfig
      summary: Update repo Actions configuration
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionsConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsConfig"

  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: Compute provider registry
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"

  /api/v1/providers/{provider}:
    get:
      tags: [providers]
      operationId: getProvider
      summary: One provider
      parameters:
        - $ref: "#/components/parameters/provider"
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/providers/computesdk/upstreams:
    get:
      tags: [providers, secrets]
      operationId: listComputesdkUpstreams
      summary: Catalog of ComputeSDK upstream providers and required secret names
      description: |
        Mirrors https://docs.computesdk.com/providers.md. No secret values.
        Used by settings UI to connect any ComputeSDK provider (not only E2B).
      responses:
        "200":
          description: Upstream catalog
          content:
            application/json:
              schema:
                type: object
                required: [upstreams]
                properties:
                  upstreams:
                    type: array
                    items:
                      type: object
                      required: [id, name, pkg, required]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        pkg:
                          type: string
                        required:
                          type: array
                          items:
                            type: string
                        optional:
                          type: array
                          items:
                            type: string
                        notes:
                          type: string

  /api/v1/providers/{provider}/connect:
    post:
      tags: [providers, secrets]
      operationId: connectProvider
      summary: Store a provider API key as an org secret (metadata-only response)
      description: |
        daytona/box: `api_key`. computesdk: any upstream from
        GET /providers/computesdk/upstreams via `upstream` + `credentials`
        (env-name keys) or single-key `api_key`. Never returns the raw value.
      parameters:
        - $ref: "#/components/parameters/provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                org:
                  type: string
                upstream:
                  type: string
                  description: "ComputeSDK upstream id (e2b, vercel, modal, …)"
                credentials:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of secret names to values (VERCEL_TOKEN, …)
                modal_token_id:
                  type: string
                  deprecated: true
                modal_token_secret:
                  type: string
                  deprecated: true
      responses:
        "200":
          description: Secret metadata (never raw value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"
    delete:
      tags: [providers, secrets]
      operationId: disconnectProvider
      summary: Remove Clotho-stored credentials for a provider
      description: Deletes well-known org secrets for the provider. Never returns values.
      parameters:
        - $ref: "#/components/parameters/provider"
        - name: org
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Which secret names were deleted
          content:
            application/json:
              schema:
                type: object
                required: [provider, deleted_secrets]
                properties:
                  provider:
                    type: string
                  deleted_secrets:
                    type: array
                    items:
                      type: string
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/compute/providers:
    get:
      tags: [providers]
      operationId: listProvidersAlias
      summary: Alias of GET /api/v1/providers
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"

  /api/v1/compute/providers/{provider}:
    get:
      tags: [providers]
      operationId: getProviderAlias
      summary: Alias of GET /api/v1/providers/{provider}
      parameters:
        - $ref: "#/components/parameters/provider"
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"

  /api/v1/orgs/{org}/secrets:
    get:
      tags: [secrets]
      operationId: listOrgSecrets
      summary: List org secrets (metadata only)
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecretMeta"
    post:
      tags: [secrets]
      operationId: createOrgSecret
      summary: Create org secret (value write-only)
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name:
                  type: string
                value:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Metadata only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"

  /api/v1/orgs/{org}/secrets/{secretName}:
    get:
      tags: [secrets]
      operationId: getOrgSecret
      summary: Org secret metadata
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/secretName"
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"
    patch:
      tags: [secrets]
      operationId: patchOrgSecret
      summary: Update org secret value and/or description
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/secretName"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"
    delete:
      tags: [secrets]
      operationId: deleteOrgSecret
      summary: Delete org secret
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/secretName"
      responses:
        "204":
          description: Deleted

  /api/v1/repos/{repo}/secrets:
    get:
      tags: [secrets]
      operationId: listRepoSecrets
      summary: List repo secrets (metadata only)
      parameters:
        - $ref: "#/components/parameters/repoPath"
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecretMeta"
    post:
      tags: [secrets]
      operationId: createRepoSecret
      summary: Create repo secret (value write-only)
      parameters:
        - $ref: "#/components/parameters/repoPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name:
                  type: string
                value:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Metadata only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"

  /api/v1/repos/{repo}/secrets/{secretName}:
    get:
      tags: [secrets]
      operationId: getRepoSecret
      summary: Repo secret metadata
      parameters:
        - $ref: "#/components/parameters/repoPath"
        - $ref: "#/components/parameters/secretName"
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"
    patch:
      tags: [secrets]
      operationId: patchRepoSecret
      summary: Update repo secret
      parameters:
        - $ref: "#/components/parameters/repoPath"
        - $ref: "#/components/parameters/secretName"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"
    delete:
      tags: [secrets]
      operationId: deleteRepoSecret
      summary: Delete repo secret
      parameters:
        - $ref: "#/components/parameters/repoPath"
        - $ref: "#/components/parameters/secretName"
      responses:
        "204":
          description: Deleted

  /api/v1/repos/{name}/agent-sessions:
    get:
      tags: [agents]
      operationId: listAgentSessions
      summary: Recent agent sessions on a repo
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: limit
          in: query
          schema:
            type: integer
        - name: within_secs
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSession"

  /api/v1/webhooks/forgejo:
    post:
      tags: [webhooks]
      operationId: forgejoWebhook
      summary: Internal Forgejo push webhook (HMAC-verified)
      responses:
        "200":
          description: Accepted
        "401":
          $ref: "#/components/responses/Error"

components:
  parameters:
    org:
      name: org
      in: path
      required: true
      schema:
        type: string
    repoName:
      name: name
      in: path
      required: true
      schema:
        type: string
    repoPath:
      name: repo
      in: path
      required: true
      schema:
        type: string
    issueNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
    pullNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
    runId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    secretName:
      name: secretName
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
