        created_at:
          type: string
    RepoInfo:
      type: object
      properties:
        id:
          type: integer
        clotho_id:
          type: string
        name:
          type: string
        full_name:
          type: string
        owner:
          type: string
        html_url:
          type: string
        clone_url:
          type: string
        default_branch:
          type: string
        description:
          type: string
        visibility:
          type: string
        has_issues:
          type: boolean
        has_pull_requests:
          type: boolean
        open_issues_count:
          type: integer
        open_pr_counter:
          type: integer
        updated_at:
          type: string
        provider:
          type: string
        configured:
          type: boolean
    CreatedRepo:
