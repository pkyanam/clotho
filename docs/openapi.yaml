openapi: 3.0.3
info:
  title: Clotho API Gateway
  description: |
    Product REST contract for Clotho (`/api/v1/*`). Humans use the CLI; agents
    use MCP tools that call this same edge; the web app and `@clotho/sdk-js`
    share it. Errors use `{ "error": "..." }` with 4xx/5xx status codes.

    **Auth:** pluggable `AuthProvider` (ADR-0018). Default `bootstrap` accepts
    `Authorization: Bearer clotho_tok_…` and, when `CLOTHO_AUTH_REQUIRED=false`,
    falls back to a bootstrap actor. Managed profiles set
    `CLOTHO_AUTH_REQUIRED=true` and `CLOTHO_AUTH_PROVIDER=clerk` (Clerk session
    JWT / org API keys; Clotho `clotho_tok_…` still accepted — §11 #7).
    Mint Clotho tokens with `POST /api/v1/tokens` or `clotho auth token create`.
    Agents never use Clerk — MCP uses scoped `clotho_agt_…` tokens minted via
    human-only `/api/v1/agents/*` (ADR-0016). Secrets master key is server-side
    only (`CLOTHO_SECRETS_MASTER_KEY`).

    **Provider Fabric (Stage 17):** `GET /api/v1/providers?layer=compute|storage|network|hub|auth`
    (omit `layer` for compute-only backward compatibility; `?all=true` for every
    layer). Arachne and StorageSDK back the storage layer; networking remains
    unconfigured until a provider is connected.
  version: 0.1.0
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8080
    description: Local dev stack (`just dev`)

tags:
  - name: auth
  - name: health
  - name: control
  - name: repos
  - name: issues
  - name: notifications
  - name: pulls
  - name: actions
  - name: providers
  - name: secrets
  - name: agents
  - name: webhooks

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openapi.yaml:
    get:
      tags: [health]
      operationId: openapiYaml
      summary: This OpenAPI document (YAML)
      responses:
        "200":
          description: OpenAPI 3 YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/users:
    get:
      tags: [control]
      operationId: listUsers
      summary: List control-plane users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"

  /api/v1/orgs:
    get:
      tags: [control]
      operationId: listOrgs
      summary: List organizations
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Org"
    post:
      tags: [control]
      operationId: createOrg
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                display_name:
                  type: string
                git_owner:
                  type: string
                  description: Git clone-path owner (input alias forgejo_owner accepted)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/orgs/{org}:
    get:
      tags: [control]
      operationId: getOrg
      summary: Org detail with members
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: Org detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/orgs/{org}/repos:
    get:
      tags: [control]
      operationId: listOrgRepos
      summary: List repos owned by an org
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoInfo"

  /api/v1/activity:
    get:
      tags: [control]
      operationId: listActivity
      summary: Global activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityEvent"

  /api/v1/repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: List all repos
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoInfo"
    post:
      tags: [repos]
      operationId: createRepo
      summary: Create a repo (VCS + collab shell)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, private, internal]
                kind:
                  type: string
                  enum: [code, model, dataset]
                  default: code
                large_file_threshold_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Kind-aware default when omitted (10 MiB code, 1 MiB model/dataset)
                network_mode:
                  type: string
                  enum: [public, tailscale]
                  default: public
                network_tags:
                  type: array
                  items:
                    type: string
                default_branch:
                  type: string
                  default: main
                owner_org:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRepo"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

        "404":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/tokens:
    get:
      tags: [auth]
      operationId: listTokens
      summary: List API tokens (metadata only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiTokenMeta"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [auth]
      operationId: createToken
      summary: Mint a new API token (plaintext shown once)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/tokens/{id}:
    delete:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke an API token
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}:
    get:
      tags: [repos]
      operationId: getRepo
      summary: Repo detail (heads, main, clone URL)
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDetail"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [repos]
      operationId: updateRepo
      summary: Update Clotho-owned repository metadata and artifact policy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, private, internal]
                kind:
                  type: string
                  enum: [code, model, dataset]
                large_file_threshold_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                network_mode:
                  type: string
                  enum: [public, tailscale]
                network_tags:
                  type: array
                  items:
                    type: string
                default_branch:
                  type: string
      responses:
        "200":
          description: Updated repo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [repos]
      operationId: deleteRepo
      summary: Delete repo (control plane + collab shell)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/tree:
    get:
      tags: [repos]
      operationId: getTree
      summary: File tree at a commit
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"

  /api/v1/repos/{name}/artifacts:
    get:
      tags: [repos]
      operationId: getArtifactManifest
      summary: Get the semantic model/dataset artifact inventory and readiness
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Logical artifact inventory; Arachne pointers are composed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactManifest"

  /api/v1/repos/{name}/artifacts/preview:
    get:
      tags: [repos]
      operationId: previewDatasetArtifact
      summary: Preview bounded rows from a CSV, TSV, or JSONL dataset artifact
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: commit_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Bounded tabular preview; at most 256 KiB is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPreview"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/imports/huggingface:
    post:
      tags: [repos, providers]
      operationId: importHuggingFaceRepository
      summary: Stream a pinned Hugging Face model/dataset snapshot into Clotho VCS and Arachne
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubImportRequest"
      responses:
        "200":
          description: Imported snapshot committed and submitted through Clotho
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/file:
    get:
      tags: [repos]
      operationId: getFile
      summary: Single file contents
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: File
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/storage:
    get:
      tags: [repos]
      operationId: getRepoStorageStats
      summary: Get logical repository and physical Arachne storage metrics
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Repository storage composition and active-store metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoStorageStats"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/commits:
    get:
      tags: [repos]
      operationId: listCommits
      summary: Commit log
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: from_commit_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Commit"
    post:
      tags: [repos]
      operationId: createCommit
      summary: Create a commit from explicit file contents
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                files:
                  type: array
                  items:
                    type: object
                    required: [path]
                    properties:
                      path:
                        type: string
                      content:
                        type: string
                        description: UTF-8 payload; mutually exclusive with content_base64
                      content_base64:
                        type: string
                        format: byte
                        description: Binary-safe payload; mutually exclusive with content
                      executable:
                        type: boolean
                deleted_paths:
                  type: array
                  items:
                    type: string
                parent_commit_ids:
                  type: array
                  items:
                    type: string
                author_name:
                  type: string
                author_email:
                  type: string
      responses:
        "201":
          description: Created commit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCommit"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/oplog:
    get:
      tags: [repos]
      operationId: getOpLog
      summary: jj operation log
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Op log
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpLogEntry"

  /api/v1/repos/{name}/submit:
    post:
      tags: [repos]
      operationId: submitChange
      summary: Submit a commit through the merge queue onto main
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit_id]
              properties:
                commit_id:
                  type: string
      responses:
        "200":
          description: Landed or conflicted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"

  /api/v1/repos/{name}/issues:
    get:
      tags: [issues]
      operationId: listIssues
      summary: List issues
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: labels
          in: query
          description: Comma-separated label names
          schema:
            type: string
        - name: assignee
          in: query
          schema:
            type: string
        - name: milestone
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
    post:
      tags: [issues]
      operationId: createIssue
      summary: Open an issue
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssue"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/issues/{number}:
    get:
      tags: [issues]
      operationId: getIssue
      summary: Issue detail with comments
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/issueNumber"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetail"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [issues]
      operationId: updateIssue
      summary: Update an issue
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/issueNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssue"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/issues/{number}/comments:
    post:
      tags: [issues]
      operationId: commentOnIssue
      summary: Comment on an issue
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/issueNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/repos/{name}/labels:
    get:
      tags: [issues]
      operationId: listLabels
      summary: List repository labels
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
    post:
      tags: [issues]
      operationId: createLabel
      summary: Create a repository label
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabel"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"

  /api/v1/repos/{name}/milestones:
    get:
      tags: [issues]
      operationId: listMilestones
      summary: List repository milestones
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema:
                type: object
                required: [milestones]
                properties:
                  milestones:
                    type: array
                    items:
                      $ref: "#/components/schemas/Milestone"
    post:
      tags: [issues]
      operationId: createMilestone
      summary: Create a repository milestone
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMilestone"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"

  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List notifications for the current user
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /api/v1/notifications/mark-read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark notifications as read
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsRead"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /api/v1/repos/{name}/merge-policy:
    get:
      tags: [repos]
      operationId: getMergePolicy
      summary: Repository merge policy
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergePolicy"
    put:
      tags: [repos]
      operationId: updateMergePolicy
      summary: Update repository merge policy (repo admin)
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMergePolicyRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergePolicy"

  /api/v1/repos/{name}/pulls:
    get:
      tags: [pulls]
      operationId: listPulls
      summary: List pull requests
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: all
      responses:
        "200":
          description: Pulls
          content:
            application/json:
              schema:
                type: object
                required: [pulls]
                properties:
                  pulls:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pull"
    post:
      tags: [pulls]
      operationId: createPull
      summary: Open a pull request
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, head]
              properties:
                title:
                  type: string
                body:
                  type: string
                head:
