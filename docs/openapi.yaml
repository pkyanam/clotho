    FabricProvider:
      type: object
      description: Shared Provider Fabric metadata (ADR-0019); never includes secrets
      properties:
        id:
          type: string
        name:
          type: string
        layer:
          type: string
          enum: [compute, storage, network, hub, auth]
        kind:
          type: string
        enabled:
          type: boolean
        configured:
          type: boolean
        configured_reason:
          type: string
        capabilities:
          type: array
          items:
            type: string
        notes:
          type: string
    FabricProviderList:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/FabricProvider"
        default_provider_id:
          type: string
        layer:
          type: string
          nullable: true
    SecretMeta:
      type: object
      description: Metadata only — never includes plaintext secret values
      properties:
        id:
          type: string
        scope:
          type: string
        org_id:
          type: string
          nullable: true
        repo_id:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
        value_last4:
          type: string
        created_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    AgentSession:
      type: object
      properties:
        agent:
          type: string
        agent_id:
          type: string
        token_id:
          type: string
        last_tool:
          type: string
        last_status:
          type: string
        last_seen:
          type: string
        first_seen:
          type: string
        tool_calls:
          type: integer
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
    AgentDetail:
      type: object
      required: [agent, tokens]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/AgentTokenMeta"
    AgentTokenMeta:
      type: object
      description: Metadata only — never includes plaintext bearer tokens
      properties:
        id:
          type: string
          format: uuid
        token_prefix:
          type: string
        allowed_repos:
          type: array
          items:
            type: string
        allowed_tools:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    MintedAgentToken:
      allOf:
        - $ref: "#/components/schemas/AgentTokenMeta"
        - type: object
          required: [token, agent, token_id]
          properties:
            token:
              type: string
              description: Plaintext bearer token — shown once at mint time
            token_id:
              type: string
              format: uuid
            agent:
              type: string
    AgentAuditEntry:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        tool:
          type: string
        repo:
          type: string
        args_digest:
          type: string
        status:
          type: string
        error:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
