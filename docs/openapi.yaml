  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: Provider Fabric registry (compute by default)
      description: |
        Without `layer`, returns the compute provider registry (Stage 12 shape).
        With `layer=compute|storage|network|hub|auth`, returns fabric metadata for
        that layer. With `all=true`, returns every layer. Storage probes
        Arachne/StorageSDK and network live-probes stored Tailscale OAuth.
      parameters:
        - name: layer
          in: query
          required: false
          schema:
            type: string
            enum: [compute, storage, network, hub, auth]
          description: Fabric layer filter
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true and layer omitted, include all fabric layers
        - name: org
          in: query
          required: false
          schema:
            type: string
          description: Organization whose provider connection state to probe
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProviderList"
                  - $ref: "#/components/schemas/FabricProviderList"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/providers/{provider}:
    get:
      tags: [providers]
      operationId: getProvider
      summary: One provider (compute or fabric stub)
      parameters:
        - $ref: "#/components/parameters/provider"
        - name: layer
          in: query
          required: false
          schema:
            type: string
            enum: [compute, storage, network, hub, auth]
        - name: org
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Provider"
                  - $ref: "#/components/schemas/FabricProvider"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/providers/computesdk/upstreams:
    get:
      tags: [providers, secrets]
      operationId: listComputesdkUpstreams
      summary: Catalog of ComputeSDK upstream providers and required secret names
      description: |
        Mirrors https://docs.computesdk.com/providers.md. No secret values.
        Used by settings UI to connect any ComputeSDK provider (not only E2B).
      responses:
        "200":
          description: Upstream catalog
          content:
            application/json:
              schema:
                type: object
                required: [upstreams]
                properties:
                  upstreams:
                    type: array
                    items:
                      type: object
                      required: [id, name, pkg, required]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        pkg:
                          type: string
                        required:
                          type: array
                          items:
                            type: string
                        optional:
                          type: array
                          items:
                            type: string
                        notes:
                          type: string

  /api/v1/providers/{provider}/connect:
    post:
      tags: [providers, secrets]
      operationId: connectProvider
      summary: Verify and encrypt provider credentials (metadata-only response)
      description: |
        daytona/box: `api_key`. computesdk: any upstream from
        GET /providers/computesdk/upstreams via `upstream` + `credentials`
        (env-name keys) or single-key `api_key`. tailscale uses `client_id` +
        `client_secret` and is live-probed before storage. Never returns raw values.
      parameters:
        - $ref: "#/components/parameters/provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                  format: password
                org:
                  type: string
                upstream:
                  type: string
                  description: "ComputeSDK upstream id (e2b, vercel, modal, …)"
                credentials:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of secret names to values (VERCEL_TOKEN, …)
                modal_token_id:
                  type: string
                  deprecated: true
                modal_token_secret:
                  type: string
                  deprecated: true
      responses:
        "200":
          description: Secret metadata (never raw value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"
    delete:
      tags: [providers, secrets]
      operationId: disconnectProvider
      summary: Remove Clotho-stored credentials for a provider
      description: Deletes well-known org secrets for the provider. Never returns values.
      parameters:
        - $ref: "#/components/parameters/provider"
        - name: org
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Which secret names were deleted
          content:
            application/json:
              schema:
                type: object
                required: [provider, deleted_secrets]
                properties:
                  provider:
                    type: string
                  deleted_secrets:
                    type: array
                    items:
                      type: string
        "404":
          $ref: "#/components/responses/Error"

