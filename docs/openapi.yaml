          type: string
        name:
          type: string
        email:
          type: string
        display_name:
          type: string
        created_at:
          type: string
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        forgejo_owner:
          type: string
        created_by:
          type: string
        created_at:
          type: string
    OrgMembership:
      type: object
      properties:
        org_id:
          type: string
