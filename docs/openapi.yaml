      tags: [actions]
      operationId: createActionRun
      summary: Start a manual Action run
      parameters:
        - $ref: "#/components/parameters/repoName"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commit_id:
                  type: string
                  description: Empty = current main head
                branch:
                  type: string
                  default: main
                actor:
                  type: string
                  default: manual
                workflow:
                  type: string
                  enum: [ci, evaluate, inference, benchmark]
                  default: ci
                release_version:
                  type: string
                  description: Required for evaluate, inference, and benchmark; resolves and verifies the immutable release commit
      responses:
        "202":
          description: Accepted / queued, or replayed from the same idempotent request
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRun"
