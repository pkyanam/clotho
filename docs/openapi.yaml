                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentAuditEntry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/agent-sessions:
    get:
      tags: [agents]
      operationId: listAgentSessions
      summary: Recent agent sessions on a repo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: limit
          in: query
          schema:
            type: integer
        - name: within_secs
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSession"

  /api/v1/webhooks/forgejo:
    post:
      tags: [webhooks]
      operationId: forgejoWebhook
      summary: Internal Forgejo push webhook (HMAC-verified)
      responses:
        "200":
          description: Accepted
        "401":
          $ref: "#/components/responses/Error"

