              schema:
                type: object
                required: [upstreams]
                properties:
                  upstreams:
                    type: array
                    items:
                      type: object
                      required: [id, name, pkg, required]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        pkg:
                          type: string
                        required:
                          type: array
                          items:
                            type: string
                        optional:
                          type: array
