openapi: 3.0.3
info:
  title: Clotho API Gateway
  description: |
    Product REST contract for Clotho (`/api/v1/*`). Humans use the CLI; agents
    use MCP tools that call this same edge; the web app and `@clotho/sdk-js`
    share it. Every response carries `X-Request-Id`. Errors use the versioned
    `Error` envelope with stable machine codes, safe messages, request
    correlation, optional structured details, and a retry hint.

    **Auth:** pluggable `AuthProvider` (ADR-0018). Default `bootstrap` accepts
    `Authorization: Bearer clotho_tok_…` and, when `CLOTHO_AUTH_REQUIRED=false`,
    falls back to a bootstrap actor. Managed profiles set
    `CLOTHO_AUTH_REQUIRED=true` and `CLOTHO_AUTH_PROVIDER=clerk` (Clerk session
    JWT / org API keys; Clotho `clotho_tok_…` still accepted — §11 #7).
    Mint Clotho tokens with `POST /api/v1/tokens` or `clotho auth token create`.
    Agents never use Clerk — MCP uses scoped `clotho_agt_…` tokens minted via
    human-only `/api/v1/agents/*` (ADR-0016). For REST-backed MCP tools the
    original agent bearer reaches this edge and is revalidated against the
    handler-selected repository and tool; agent authority is never replaced
    by an internal service credential. Secrets master key is server-side only
    (`CLOTHO_SECRETS_MASTER_KEY`).

    **Provider Fabric (Stage 17):** `GET /api/v1/providers?layer=compute|storage|network|hub|auth`
    (omit `layer` for compute-only backward compatibility; `?all=true` for every
    layer). Arachne and StorageSDK back the storage layer; networking remains
    unconfigured until a provider is connected.
  version: 0.1.0
  license:
    name: Apache-2.0

# Defaults inherited by every operation unless an operation overrides the
# corresponding x-clotho-* field. These extensions make alpha stability,
# authentication posture, and the versioned error contract machine-readable
# without duplicating policy across more than one hundred operations.
x-clotho-contract:
  stability: alpha
  auth: bootstrap-or-bearer
  errorResponse: "#/components/responses/Error"

servers:
  - url: http://localhost:8080
    description: Local dev stack (`just dev`)

tags:
  - name: auth
  - name: health
  - name: control
  - name: repos
  - name: issues
  - name: notifications
  - name: pulls
  - name: actions
  - name: providers
  - name: secrets
  - name: agents
  - name: webhooks

paths:
  /healthz:
    get:
      x-clotho-auth: public
      tags: [health]
      operationId: healthz
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openapi.yaml:
    get:
      x-clotho-auth: public
      tags: [health]
      operationId: openapiYaml
      summary: This OpenAPI document (YAML)
      responses:
        "200":
          description: OpenAPI 3 YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/users:
    get:
      tags: [control]
      operationId: listUsers
      summary: List control-plane users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"

  /api/v1/orgs:
    get:
      tags: [control]
      operationId: listOrgs
      summary: List organizations
      responses:
        "200":
          description: Org list
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Org"
    post:
      tags: [control]
      operationId: createOrg
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                display_name:
                  type: string
                git_owner:
                  type: string
                  description: Git clone-path owner (input alias forgejo_owner accepted)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/orgs/{org}:
    get:
      tags: [control]
      operationId: getOrg
      summary: Org detail with members
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: Org detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/orgs/{org}/repos:
    get:
      tags: [control]
      operationId: listOrgRepos
      summary: List repos owned by an org
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repoPageLimit"
        - $ref: "#/components/parameters/repoPageCursor"
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"

  /api/v1/activity:
    get:
      tags: [control]
      operationId: listActivity
      summary: Global activity feed
      parameters:
        - $ref: "#/components/parameters/activityPageLimit"
        - $ref: "#/components/parameters/activityPageCursor"
      responses:
        "200":
          description: Bounded activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"

  /api/v1/repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: List all repos
      parameters:
        - $ref: "#/components/parameters/repoPageLimit"
        - $ref: "#/components/parameters/repoPageCursor"
      responses:
        "200":
          description: Repo list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
    post:
      tags: [repos]
      operationId: createRepo
      summary: Create a repo (VCS + collab shell)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, private, internal]
                kind:
                  type: string
                  enum: [code, model, dataset]
                  default: code
                large_file_threshold_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Kind-aware default when omitted (10 MiB code, 1 MiB model/dataset)
                network_mode:
                  type: string
                  enum: [public, tailscale]
                  default: public
                network_tags:
                  type: array
                  items:
                    type: string
                default_branch:
                  type: string
                  default: main
                owner_org:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRepo"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

        "404":
          $ref: "#/components/responses/Error"

  /api/v1/capabilities:
    get:
      tags: [platform]
      operationId: getCapabilities
      summary: Discover the versioned public-alpha capability contract
      security: []
      x-clotho-stability: alpha
      responses:
        "200":
          description: Machine-readable product capabilities and limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityDocument"

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/tokens:
    get:
      tags: [auth]
      operationId: listTokens
      summary: List API tokens (metadata only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiTokenMeta"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [auth]
      operationId: createToken
      summary: Mint a new API token (plaintext shown once)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/tokens/{id}:
    delete:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke an API token
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}:
    get:
      tags: [repos]
      operationId: getRepo
      summary: Repo detail (heads, main, clone URL)
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDetail"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [repos]
      operationId: updateRepo
      summary: Update Clotho-owned repository metadata and artifact policy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, private, internal]
                kind:
                  type: string
                  enum: [code, model, dataset]
                large_file_threshold_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                network_mode:
                  type: string
                  enum: [public, tailscale]
                network_tags:
                  type: array
                  items:
                    type: string
                default_branch:
                  type: string
      responses:
        "200":
          description: Updated repo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [repos]
      operationId: deleteRepo
      summary: Delete repo (control plane + collab shell)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/tree:
    get:
      tags: [repos]
      operationId: getTree
      summary: File tree at a commit
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"

  /api/v1/repos/{name}/artifacts:
    get:
      tags: [repos]
      operationId: getArtifactManifest
      summary: Get the semantic model/dataset artifact inventory and readiness
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Logical artifact inventory; Arachne pointers are composed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactManifest"

  /api/v1/repos/{name}/artifacts/preview:
    get:
      tags: [repos]
      operationId: previewDatasetArtifact
      summary: Preview bounded rows from a CSV, TSV, or JSONL dataset artifact
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: commit_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Bounded tabular preview; at most 256 KiB is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPreview"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/imports/huggingface:
    post:
      tags: [repos, providers]
      operationId: importHuggingFaceRepository
      summary: Stream a pinned Hugging Face model/dataset snapshot into Clotho VCS and Arachne
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubImportRequest"
      responses:
        "200":
          description: Imported snapshot committed and submitted through Clotho
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/releases:
    get:
      tags: [repos]
      operationId: listRepoReleases
      summary: List immutable Clotho releases for a repository
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      responses:
        "200":
          description: Release summaries with live manifest verification
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoReleaseSummary"
    post:
      tags: [repos]
      operationId: createRepoRelease
      summary: Bind an immutable version to a commit and semantic artifact manifest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRelease"
      responses:
        "201":
          description: Immutable release created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRelease"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/releases/{version}:
    get:
      tags: [repos]
      operationId: getRepoRelease
      summary: Get and verify an immutable repository release
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Release and frozen semantic manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRelease"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/repos/{name}/releases/{version}/resolve/{path}:
    get:
      tags: [repos]
      operationId: downloadRepoReleaseFile
      summary: Stream an exact file from an immutable Clotho release
      description: Large files stream directly from Arachne and are never buffered by the gateway.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: Slash-containing repository path
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: One RFC 9110 byte range; Arachne reconstructs only intersecting segments
          schema:
            type: string
            example: bytes=1048576-2097151
      responses:
        "200":
          description: Byte-identical release file
          headers:
            ETag:
              schema:
                type: string
            X-Clotho-Commit-Id:
              schema:
                type: string
            X-Clotho-Manifest-Sha256:
              schema:
                type: string
            X-Clotho-Arachne-Hash:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range
          headers:
            Accept-Ranges: { schema: { type: string, example: bytes } }
            Content-Range:
              {
                schema:
                  { type: string, example: bytes 1048576-2097151/8388608 },
              }
            ETag: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "416":
          description: Unsatisfiable or multiple byte ranges
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    head:
      tags: [repos]
      operationId: headRepoReleaseFile
      summary: Inspect immutable release file size, digest, and provenance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/repoName"
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Release file metadata in headers

  /api/models:
    get:
      tags: [repos, providers]
      operationId: huggingFaceListModels
      summary: Search permission-checked models with verified Clotho releases
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - {
            name: filter,
            in: query,
            schema: { type: string },
            description: Match task,
            library,
            language,
            dataset,
            or card tags,
          }
        - { name: author, in: query, schema: { type: string } }
        - { name: pipeline_tag, in: query, schema: { type: string } }
        - { name: gated, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0 } }
        - { name: full, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Hugging Face ModelInfo-compatible catalog entries
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/models/{owner}/{name}:
    get:
      tags: [repos, providers]
      operationId: huggingFaceModelInfo
      summary: Hugging Face-compatible model info projected from a Clotho release
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: revision, in: query, schema: { type: string, default: main } }
        - {
            name: files_metadata,
            in: query,
            schema: { type: boolean, default: false },
          }
      responses:
        "200":
          description: Hugging Face ModelInfo-compatible object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuggingFaceObject" }
        "404": { $ref: "#/components/responses/Error" }

  /api/models/{owner}/{name}/tree/{revision}:
    get:
      tags: [repos, providers]
      operationId: huggingFaceModelTree
      summary: Hugging Face-compatible model release tree
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
        - {
            name: recursive,
            in: query,
            schema: { type: boolean, default: false },
          }
        - { name: expand, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: RepoFile and RepoFolder-compatible entries
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/models/{owner}/{name}/refs:
    get:
      tags: [repos, providers]
      operationId: huggingFaceModelRefs
      summary: List main and verified immutable releases as Hugging Face refs
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - {
            name: include_prs,
            in: query,
            schema: { type: integer, enum: [0, 1] },
          }
      responses:
        "200":
          description: Hugging Face GitRefs-compatible object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuggingFaceObject" }

  /api/models/{owner}/{name}/commits/{revision}:
    get:
      tags: [repos, providers]
      operationId: huggingFaceModelCommits
      summary: List Clotho VCS commits from a verified model release revision
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Hugging Face GitCommitInfo-compatible array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuggingFaceObjectList" }

  /api/models/{owner}/{name}/revision/{revision}:
    get:
      tags: [repos, providers]
      operationId: huggingFaceModelInfoRevision
      summary: Hugging Face-compatible model info for a path revision
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
        - { name: blobs, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Hugging Face ModelInfo-compatible object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuggingFaceObject" }

  /{owner}/{name}/resolve/{revision}/{path}:
    get:
      tags: [repos, providers]
      operationId: huggingFaceResolveModelFile
      summary: Hugging Face-compatible model file resolution through Arachne
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Immutable model release bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    head:
      tags: [repos, providers]
      operationId: huggingFaceHeadModelFile
      summary: Inspect model release file metadata
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Immutable file headers }

  /api/datasets:
    get:
      tags: [repos, providers]
      operationId: huggingFaceListDatasets
      summary: Search permission-checked datasets with verified Clotho releases
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - {
            name: filter,
            in: query,
            schema: { type: string },
            description: Match task,
            format,
            language,
            or card tags,
          }
        - { name: author, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0 } }
        - { name: full, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Hugging Face DatasetInfo-compatible catalog entries
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/datasets/{owner}/{name}:
    get:
      tags: [repos, providers]
