  /api/v1/providers/{provider}/connect:
    post:
      tags: [providers, secrets]
      operationId: connectProvider
      summary: Verify and encrypt provider credentials (metadata-only response)
      description: |
        daytona/box: `api_key`. computesdk: any upstream from
        GET /providers/computesdk/upstreams via `upstream` + `credentials`
        (env-name keys) or single-key `api_key`. tailscale uses `client_id` +
        `client_secret` and is live-probed before storage. Never returns raw values.
      parameters:
        - $ref: "#/components/parameters/provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                  format: password
                org:
                  type: string
                upstream:
                  type: string
                  description: "ComputeSDK upstream id (e2b, vercel, modal, …)"
                credentials:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of secret names to values (VERCEL_TOKEN, …)
                modal_token_id:
                  type: string
                  deprecated: true
                modal_token_secret:
                  type: string
                  deprecated: true
      responses:
        "200":
          description: Secret metadata (never raw value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMeta"
