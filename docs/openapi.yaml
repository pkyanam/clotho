      summary: Provider Fabric registry (compute by default)
      description: |
        Without `layer`, returns the compute provider registry (Stage 12 shape).
        With `layer=compute|storage|network|hub|auth`, returns fabric metadata for
        that layer. With `all=true`, returns every layer. Storage probes
        Arachne/StorageSDK and network live-probes stored Tailscale OAuth.
      parameters:
        - name: layer
          in: query
          required: false
          schema:
            type: string
            enum: [compute, storage, network, hub, auth]
          description: Fabric layer filter
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true and layer omitted, include all fabric layers
        - name: org
          in: query
          required: false
          schema:
            type: string
          description: Organization whose provider connection state to probe
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProviderList"
                  - $ref: "#/components/schemas/FabricProviderList"
        "400":
          $ref: "#/components/responses/Error"

