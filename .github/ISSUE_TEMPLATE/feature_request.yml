name: Feature request
description: Propose a Clotho capability or product-contract change.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent outcome is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe REST-first semantics and affected SDK, CLI, MCP, and web surfaces.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security, tenancy, and durability considerations
      description: Include authority, secret handling, failure behavior, persistence, limits, and recovery.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
